name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm ci` installs the platform-specific optional deps recorded in the
        # lockfile. A lockfile generated on another OS omits this runner's native
        # binaries (e.g. Rollup's `@rollup/rollup-linux-x64-gnu`) — npm/cli#4828 —
        # so fall back to a fresh resolve when the pinned install can't satisfy it.
        run: npm ci || (rm -rf node_modules package-lock.json && npm install --no-audit --no-fund)

      - name: Type-check (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
