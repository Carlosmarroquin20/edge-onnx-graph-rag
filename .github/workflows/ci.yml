name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # The committed lockfile is cross-platform (it records every platform's
        # native optional deps — Rollup/esbuild binaries — regenerated with npm
        # 11), so `npm ci` installs this runner's Linux binaries reproducibly.
        run: npm ci --no-audit --no-fund

      - name: Type-check (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
