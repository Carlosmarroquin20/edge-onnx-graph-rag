name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The committed lockfile is generated on Windows and omits this runner's
        # platform-native optional deps (Rollup's binaries). `npm ci` treats them
        # as optional and exits 0 without them, so vitest later fails to load
        # `@rollup/rollup-linux-x64-gnu` at runtime (npm/cli#4828). Resolve fresh
        # against package.json so the correct platform binary installs here.
        run: rm -f package-lock.json && npm install --no-audit --no-fund

      - name: Type-check (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
